# 2 ShotGun
# 3 SuperShotgun
# 4 MachineGun
# 5 ChainGun
# 6 Hand Grenade
# 7 Grenade Launcher
# 8 Rocket Launcher
# 9 Hyper Blaster
# 10 Rail Gun
# 11 BFG10K
# 12 Plasma Gun
# 13 Ion Ripper

# 11    dodge(depend on combat skill)       (0 - 1) 1-On 0-Off
